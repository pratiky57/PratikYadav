<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta Tags -->
  <title>Pratik Yadav — Official Website & Portfolio</title>
  <meta name="title" content="Pratik Yadav — Official Website & Portfolio">
  <meta name="description" content="Official website of Pratik Yadav. Exploring web development, science, and interactive digital experiences. Play Star Catcher and explore projects. ">
  <meta name="keywords" content="Pratik Yadav, Pratik Yadav Nepal, Pratik Yadav official website, Pratik Yadav developer, Pratik Yadav game">
  <meta name="author" content="Pratik Yadav">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pratik Yadav — Official Website">
  <meta property="og:description" content="Official homepage of Pratik Yadav. Interactive web projects, physics insights, and browser games.">
  <meta property="og:image" content="https://pratikyadav.com.np/og-image.jpg">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pratik Yadav — Official Website">
  <meta name="twitter:description" content="Official homepage of Pratik Yadav. Interactive web projects and browser games.">

  <!-- Structured Data (JSON-LD Person Schema) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Pratik Yadav",
    "alternateName": ["Pratik", "Yadav"],

    "knowsAbout": ["Web Development", "Physics", "Computer Science"]

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0e1a;
      --bg-mid: #141c30;
      --accent-gold: #f4c430;
      --accent-teal: #4ee0d1;
      --text-main: #f0f4f8;
      --text-muted: #94a3b8;
      --font-display: 'Fraunces', serif;
      --font-ui: 'Space Grotesk', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-ui);
    }

    #skyCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .mountains {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 45vh;
      z-index: 2;
      pointer-events: none;
    }

    .hero {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 0 1.5rem;
    }

    .badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      background: rgba(244, 196, 48, 0.1);
      border: 1px solid rgba(244, 196, 48, 0.3);
      border-radius: 50px;
      color: var(--accent-gold);
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      animation: fadeIn 1s ease-out;
    }

    h1.name {
      font-family: var(--font-display);
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      font-weight: 700;
      letter-spacing: -1px;
      color: var(--text-main);
      line-height: 1.1;
      margin-bottom: 0.75rem;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
      animation: fadeIn 1.2s ease-out;
    }

    p.subtitle {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: var(--text-muted);
      max-width: 520px;
      margin-bottom: 2.5rem;
      font-weight: 400;
      animation: fadeIn 1.4s ease-out;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      animation: fadeIn 1.6s ease-out;
    }

    .play-btn {
      position: relative;
      background: linear-gradient(135deg, var(--accent-gold), #d49e19);
      color: #0c101c;
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 1.1rem;
      padding: 1rem 2.5rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(244, 196, 48, 0.3);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .play-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 0 35px rgba(244, 196, 48, 0.5);
    }

    .play-btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .notes-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: transparent;
      color: var(--accent-teal);
      font-family: var(--font-ui);
      font-weight: 600;
      font-size: 1rem;
      padding: 0.85rem 2.2rem;
      border: 1px solid rgba(78, 224, 209, 0.35);
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .notes-btn:hover {
      background: rgba(78, 224, 209, 0.08);
      border-color: rgba(78, 224, 209, 0.7);
      transform: translateY(-2px);
    }

    .notes-btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .notes-btn .spark {
      font-size: 0.9rem;
    }

    .game-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(10, 14, 26, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .game-modal.active {
      opacity: 1;
      pointer-events: all;
    }

    .game-container {
      position: relative;
      width: min(90vw, 700px);
      height: min(70vh, 500px);
      background: var(--bg-mid);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: none;
    }

    .game-hud {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-gold);
      pointer-events: none;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      z-index: 101;
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: rgba(255,255,255,0.25);
    }

    .game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(10, 14, 26, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .game-over-screen.active {
      opacity: 1;
      pointer-events: all;
    }

    .game-over-screen h2 {
      font-family: var(--font-display);
      font-size: 2.5rem;
      color: var(--accent-gold);
      margin-bottom: 0.5rem;
    }

    .game-over-screen p {
      font-size: 1.2rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Background Sky Canvas -->
  <canvas id="skyCanvas" aria-hidden="true"></canvas>

  <!-- Mountain Silhouette SVG -->
  <svg class="mountains" viewBox="0 0 1440 320" preserveAspectRatio="none" aria-hidden="true">
    <path fill="#0d1424" fill-opacity="0.7" d="M0,192L80,181.3C160,171,320,149,480,165.3C640,181,800,235,960,224C1120,213,1280,139,1360,101.3L1440,64L1440,320L1360,320C1280,320,1120,320,960,320C800,320,640,320,480,320C320,320,160,320,80,320L0,320Z"></path>
    <path fill="#080b14" d="M0,224L60,213.3C120,203,240,181,360,197.3C480,213,600,267,720,261.3C840,256,960,192,1080,181.3C1200,171,1320,213,1380,234.7L1440,256L1440,320L1380,320C1320,320,1200,320,1080,320C960,320,840,320,720,320C600,320,480,320,360,320C240,320,120,320,60,320L0,320Z"></path>
  </svg>

  <!-- Main Content -->
  <main class="hero">
    <span class="badge">Official Website</span>
    <h1 class="name">Pratik Yadav</h1>
    <p class="subtitle">Exploring web development, science, and building interactive digital experiences.</p>
    <div class="btn-group">
      <button class="play-btn" id="openGameBtn" aria-label="Play Star Catcher Mini-Game">Play Star Catcher</button>
      <a href="notes.html" class="notes-btn" aria-label="Stuff I Learnt notes page"><span class="spark">✦</span> Stuff I Learnt</a>
    </div>
  </main>

  <!-- Interactive Mini-Game Modal -->
  <div class="game-modal" id="gameModal" role="dialog" aria-modal="true" aria-label="Star Catcher Game Window">
    <button class="close-btn" id="closeGameBtn" aria-label="Close Game">&times;</button>
    <div class="game-container">
      <div class="game-hud">
        <span id="scoreText">Score: 0</span>
        <span id="timerText">Time: 45s</span>
      </div>
      <canvas id="gameCanvas"></canvas>
      
      <div class="game-over-screen" id="gameOverScreen">
        <h2>Game Over</h2>
        <p id="finalScoreText">You caught 0 stars!</p>
        <button class="play-btn" id="restartGameBtn">Play Again</button>
      </div>
    </div>
  </div>

  <script>
    const skyCanvas = document.getElementById('skyCanvas');
    const skyCtx = skyCanvas.getContext('2d');
    let stars = [];

    function resizeSky() {
      skyCanvas.width = window.innerWidth;
      skyCanvas.height = window.innerHeight;
      initStars();
    }

    function initStars() {
      stars = [];
      const numStars = Math.floor((skyCanvas.width * skyCanvas.height) / 3000);
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * skyCanvas.width,
          y: Math.random() * skyCanvas.height * 0.7,
          radius: Math.random() * 1.5 + 0.5,
          alpha: Math.random(),
          speed: Math.random() * 0.02 + 0.005
        });
      }
    }

    function drawSky() {
      skyCtx.clearRect(0, 0, skyCanvas.width, skyCanvas.height);
      stars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
        skyCtx.fillStyle = `rgba(244, 196, 48, ${Math.abs(star.alpha)})`;
        skyCtx.beginPath();
        skyCtx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        skyCtx.fill();
      });
      requestAnimationFrame(drawSky);
    }

    window.addEventListener('resize', resizeSky);
    resizeSky();
    drawSky();

    const gameModal = document.getElementById('gameModal');
    const openGameBtn = document.getElementById('openGameBtn');
    const closeGameBtn = document.getElementById('closeGameBtn');
    const restartGameBtn = document.getElementById('restartGameBtn');
    const gameOverScreen = document.getElementById('gameOverScreen');
    
    const gameCanvas = document.getElementById('gameCanvas');
    const gameCtx = gameCanvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const timerText = document.getElementById('timerText');
    const finalScoreText = document.getElementById('finalScoreText');

    let gameActive = false;
    let score = 0;
    let timeLeft = 45;
    let gameLoopId, timerInterval;

    let basket = { x: 0, y: 0, width: 80, height: 15 };
    let fallingStars = [];
    let particles = [];

    function initGameCanvas() {
      const rect = gameCanvas.parentElement.getBoundingClientRect();
      gameCanvas.width = rect.width;
      gameCanvas.height = rect.height;
      basket.y = gameCanvas.height - 30;
      basket.x = gameCanvas.width / 2 - basket.width / 2;
    }

    function startGame() {
      initGameCanvas();
      score = 0;
      timeLeft = 45;
      fallingStars = [];
      particles = [];
      gameActive = true;
      gameOverScreen.classList.remove('active');
      scoreText.innerText = `Score: ${score}`;
      timerText.innerText = `Time: ${timeLeft}s`;

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timerText.innerText = `Time: ${timeLeft}s`;
        if (timeLeft <= 0) endGame();
      }, 1000);

      cancelAnimationFrame(gameLoopId);
      gameLoop();
    }

    function endGame() {
      gameActive = false;
      clearInterval(timerInterval);
      finalScoreText.innerText = `You caught ${score} stars!`;
      gameOverScreen.classList.add('active');
    }

    function spawnStar() {
      if (Math.random() < 0.05) {
        fallingStars.push({
          x: Math.random() * (gameCanvas.width - 20) + 10,
          y: -10,
          speed: Math.random() * 2 + 2 + (45 - timeLeft) * 0.05,
          radius: 8
        });
      }
    }

    function createParticles(x, y) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          alpha: 1,
          color: '#4ee0d1'
        });
      }
    }

    function updateGame() {
      if (!gameActive) return;

      spawnStar();

      if (keys['ArrowLeft'] || keys['a']) basket.x -= 7;
      if (keys['ArrowRight'] || keys['d']) basket.x += 7;
      basket.x = Math.max(0, Math.min(gameCanvas.width - basket.width, basket.x));

      for (let i = fallingStars.length - 1; i >= 0; i--) {
        let s = fallingStars[i];
        s.y += s.speed;

        if (
          s.y + s.radius >= basket.y &&
          s.x >= basket.x &&
          s.x <= basket.x + basket.width
        ) {
          score += 10;
          scoreText.innerText = `Score: ${score}`;
          createParticles(s.x, s.y);
          fallingStars.splice(i, 1);
          continue;
        }

        if (s.y > gameCanvas.height) {
          fallingStars.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;
        if (p.alpha <= 0) particles.splice(i, 1);
      }
    }

    function renderGame() {
      gameCtx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);

      if (gameActive) {
        gameCtx.fillStyle = '#f4c430';
        gameCtx.beginPath();
        gameCtx.roundRect(basket.x, basket.y, basket.width, basket.height, 8);
        gameCtx.fill();

        fallingStars.forEach(s => {
          gameCtx.fillStyle = '#ffffff';
          gameCtx.beginPath();
          gameCtx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          gameCtx.fill();
        });

        particles.forEach(p => {
          gameCtx.fillStyle = p.color;
          gameCtx.globalAlpha = p.alpha;
          gameCtx.beginPath();
          gameCtx.arc(p.x, p.y, 3, 0, Math.PI * 2);
          gameCtx.fill();
          gameCtx.globalAlpha = 1.0;
        });
      }
    }

    function gameLoop() {
      updateGame();
      renderGame();
      if (gameActive) gameLoopId = requestAnimationFrame(gameLoop);
    }

    const keys = {};
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    gameCanvas.addEventListener('mousemove', e => {
      const rect = gameCanvas.getBoundingClientRect();
      basket.x = e.clientX - rect.left - basket.width / 2;
    });

    gameCanvas.addEventListener('touchmove', e => {
      const rect = gameCanvas.getBoundingClientRect();
      if (e.touches.length > 0) {
        basket.x = e.touches[0].clientX - rect.left - basket.width / 2;
      }
    }, { passive: true });

    openGameBtn.addEventListener('click', () => {
      gameModal.classList.add('active');
      startGame();
    });

    closeGameBtn.addEventListener('click', () => {
      gameModal.classList.remove('active');
      gameActive = false;
      clearInterval(timerInterval);
    });

    restartGameBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
